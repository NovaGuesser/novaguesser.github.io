            <br>   
            <button id="button" onclick="anFunc()"> Submit Guess </button>
            <p id="guessMessage"> </p>
            <script>
                let correct = "Bartley Hall"
                let day = "1"
                
                let done = false
                let attempt = 1
                let winMessage = ""
                function anFunc() {                    
                    if (attempt < 7 && done != true)
                    {
                        let guess = document.querySelector("#guess");
                        let guessMessage = document.querySelector("#guessMessage");
                        guessMessage.innerHTML = guessMessage.innerHTML + "<br>" + guess.value;
                        if (guess.value == correct) {
                            guessMessage.innerHTML = guessMessage.innerHTML + " 🟩"
                            done = true
                            for (let i = 1; i < 7; i++) {
                                if (attempt == i) {
                                    winMessage = winMessage + "🟩"
                                }
                                else if (attempt > i) {
                                    winMessage = winMessage + "🟥"
                                }
                                else {
                                    winMessage = winMessage + "⬛"
                                }
                            }
                            guessMessage.innerHTML = "NovaGuesser #" + day + " " + attempt + "/6<br>" + winMessage + "<br><br><br>Today's spot was " + correct + "."
                        }
                        else {
                            guessMessage.innerHTML = guessMessage.innerHTML + " 🟥"
                            attempt++;
                            if (attempt == 7) {
                                guessMessage.innerHTML = "NovaGuesser #" + day + " x/6<br>🟥🟥🟥🟥🟥🟥<br><br><br>Today's spot was " + correct + "."
                            }
                        }

                    }  
                }
            </script>
